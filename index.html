<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аудиоплееры</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 20px;
      text-align: center;
    }

    .players {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .track-time {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #1a1a1a;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .play-btn:active { transform: scale(0.93); }
    .play-btn.playing { background: #555; }

    .progress-wrap {
      height: 6px;
      background: #e8e8e8;
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #1a1a1a;
      border-radius: 99px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <h1>🎵 Аудиоплееры</h1>

  <div class="players">

    <div class="card">
      <div class="card-header">
        <div class="num">1</div>
        <div class="track-info">
          <div class="track-title">Трек 1</div>
          <div class="track-time" id="time1">0:00 / –:––</div>
        </div>
        <button class="play-btn" id="btn1" onclick="togglePlay(1)" aria-label="Воспроизвести трек 1">▶</button>
      </div>
      <div class="progress-wrap" onclick="seek(1, event, this)">
        <div class="progress-bar" id="prog1"></div>
      </div>
      <audio id="audio1" src="https://www.image2url.com/r2/default/audio/1781423495192-a71cd788-b522-4984-896b-53a6ec332f00.mp3" preload="metadata"></audio>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="num">2</div>
        <div class="track-info">
          <div class="track-title">Трек 2</div>
          <div class="track-time" id="time2">0:00 / –:––</div>
        </div>
        <button class="play-btn" id="btn2" onclick="togglePlay(2)" aria-label="Воспроизвести трек 2">▶</button>
      </div>
      <div class="progress-wrap" onclick="seek(2, event, this)">
        <div class="progress-bar" id="prog2"></div>
      </div>
      <audio id="audio2" src="https://www.image2url.com/r2/default/audio/1781423602385-9779eeff-49f9-4437-80df-302dbc76069c.mp3" preload="metadata"></audio>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="num">3</div>
        <div class="track-info">
          <div class="track-title">Трек 3</div>
          <div class="track-time" id="time3">0:00 / –:––</div>
        </div>
        <button class="play-btn" id="btn3" onclick="togglePlay(3)" aria-label="Воспроизвести трек 3">▶</button>
      </div>
      <div class="progress-wrap" onclick="seek(3, event, this)">
        <div class="progress-bar" id="prog3"></div>
      </div>
      <audio id="audio3" src="https://www.image2url.com/r2/default/audio/1781423638487-9c604696-b275-45f7-8bd4-2b7b3bfbbdf3.mp3" preload="metadata"></audio>
    </div>

  </div>

  <script>
    function fmt(s) {
      if (!isFinite(s)) return '–:––';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function togglePlay(n) {
      const a = document.getElementById('audio' + n);
      const btn = document.getElementById('btn' + n);
      [1, 2, 3].forEach(i => {
        if (i !== n) {
          document.getElementById('audio' + i).pause();
          document.getElementById('btn' + i).textContent = '▶';
          document.getElementById('btn' + i).classList.remove('playing');
        }
      });
      if (a.paused) {
        a.play();
        btn.textContent = '⏸';
        btn.classList.add('playing');
      } else {
        a.pause();
        btn.textContent = '▶';
        btn.classList.remove('playing');
      }
    }

    function seek(n, e, bar) {
      const a = document.getElementById('audio' + n);
      if (!a.duration) return;
      const rect = bar.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      a.currentTime = Math.max(0, Math.min(1, ratio)) * a.duration;
    }

    [1, 2, 3].forEach(n => {
      const a = document.getElementById('audio' + n);
      a.addEventListener('timeupdate', () => {
        const p = a.duration ? (a.currentTime / a.duration * 100) : 0;
        document.getElementById('prog' + n).style.width = p.toFixed(1) + '%';
        document.getElementById('time' + n).textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration);
      });
      a.addEventListener('ended', () => {
        document.getElementById('btn' + n).textContent = '▶';
        document.getElementById('btn' + n).classList.remove('playing');
        document.getElementById('prog' + n).style.width = '0%';
        document.getElementById('time' + n).textContent = '0:00 / ' + fmt(a.duration);
      });
      a.addEventListener('loadedmetadata', () => {
        document.getElementById('time' + n).textContent = '0:00 / ' + fmt(a.duration);
      });
    });
  </script>

</body>
</html>
